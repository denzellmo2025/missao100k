<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Missão 100K</title>
<meta name="description" content="App pessoal de finanças com o Jurandir: limite do dia, tribunal da compra, dívidas, meta de R$ 100 mil e jornada com chefões.">
<meta name="theme-color" content="#EDF1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D191B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}
/* Layout: app de bolso em coluna única (máx. 760px), abas fixas embaixo, o patrimônio vira uma cédula com guilhochê */
:root {
  --paper: #EDF1EB;
  --surface: #FFFFFF;
  --surface-2: #F5F8F3;
  --ink: #15282C;
  --muted: #5B6F71;
  --line: #D3DCD3;
  --pig: #EC7593;
  --pig-deep: #C44D6C;
  --pig-soft: #FBDCE4;
  --note: #1C7660;
  --note-soft: #D5ECE3;
  --gold: #C98B0B;
  --gold-soft: #F7E6BE;
  --bad: #C2402D;
  --bad-soft: #F6D9D3;
  --warn: #B87309;
  --warn-soft: #F5E5C3;
  --ink-inv: #FFFFFF;
  --shadow: 0 1px 0 rgba(21, 40, 44, .05), 0 10px 24px -16px rgba(21, 40, 44, .35);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 16px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D191B; --surface: #142427; --surface-2: #1A2D31; --ink: #E5EEEA; --muted: #93A7A7; --line: #27403F;
    --pig: #F28BA7; --pig-deep: #E46A8D; --pig-soft: #3B2330; --note: #45C69E; --note-soft: #163A31;
    --gold: #F0B33A; --gold-soft: #3A2F15; --bad: #F2735F; --bad-soft: #3E231F; --warn: #F0A93C; --warn-soft: #3A2C15;
    --ink-inv: #0D191B; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D191B; --surface: #142427; --surface-2: #1A2D31; --ink: #E5EEEA; --muted: #93A7A7; --line: #27403F;
  --pig: #F28BA7; --pig-deep: #E46A8D; --pig-soft: #3B2330; --note: #45C69E; --note-soft: #163A31;
  --gold: #F0B33A; --gold-soft: #3A2F15; --bad: #F2735F; --bad-soft: #3E231F; --warn: #F0A93C; --warn-soft: #3A2C15;
  --ink-inv: #0D191B; --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -16px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 800; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--note); }
.num, .tab-num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--pig); outline-offset: 2px; border-radius: 6px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }

.app { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }

/* ---------- topo ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.top .mini-pig { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--pig-soft); display: grid; place-items: center; cursor: pointer; padding: 0; }
.top .mini-pig svg { width: 40px; height: 34px; }
.lvl { flex: 1; min-width: 0; }
.lvl-name { font-family: var(--f-display); font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xpbar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; margin-block: 4px 2px; }
.xpbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--pig)); border-radius: 99px; transition: width .5s ease; }
.xp-meta { font-size: .75rem; color: var(--muted); font-family: var(--f-mono); }
.streak { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-family: var(--f-display); }
.streak b { font-size: 1.15rem; }
.streak small { color: var(--muted); font-family: var(--f-body); font-size: .72rem; }
.streak svg { width: 18px; height: 18px; color: var(--pig-deep); }
.streak .shield { color: var(--note); width: 15px; height: 15px; margin-left: 2px; }

.banner { margin-top: 12px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--ink); font-size: .88rem; display: flex; gap: 10px; align-items: flex-start; }
.banner b { font-weight: 700; }

/* ---------- navegação ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button svg { width: 23px; height: 23px; }
.tabs button[aria-current="page"] { color: var(--pig-deep); }
.tabs button[aria-current="page"] svg { transform: translateY(-1px); }

.fab { position: fixed; z-index: 24; right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 54px; padding: 0 20px 0 16px; border-radius: 27px; border: 0; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .45); cursor: pointer; }
.fab svg { width: 22px; height: 22px; }
@media (min-width: 820px) { .fab { right: calc(50% - 380px + 16px); } }

/* ---------- estrutura de seção ---------- */
.view { display: grid; gap: 14px; padding-top: 14px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.view-head p { color: var(--muted); font-size: .92rem; }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 99px; font-weight: 600; font-size: .88rem; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.view > *, .card > *, .verdict > *, .sheet > * { min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.soft { background: var(--surface-2); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card-head .eyebrow { margin-bottom: 2px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .76rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .grid3 { gap: 8px; } .grid3 .stat { padding: 8px 10px; } .grid3 .stat .v { font-size: 1rem; } }
.btns3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btns3 .btn { padding: 10px 6px; font-size: .88rem; }
.stack { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.sep { height: 1px; background: var(--line); margin-block: 2px; }

.big { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.mid { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pos { color: var(--note); }
.neg { color: var(--bad); }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: .76rem; color: var(--muted); }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* ---------- barras ---------- */
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--note); }
.bar.warn > span { background: var(--warn); }
.bar.bad > span { background: var(--bad); }
.bar.thin { height: 6px; }

/* ---------- botões ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; line-height: 1.2; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.pig { background: var(--pig); color: #2A0C15; border-color: var(--pig); }
.btn.good { background: var(--note); color: var(--ink-inv); border-color: var(--note); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.sm { padding: 6px 11px; font-size: .85rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: none; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.action { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; text-align: left; cursor: pointer; display: grid; gap: 6px; align-content: start; min-height: 92px; }
.action svg { width: 26px; height: 26px; }
.action b { font-family: var(--f-display); font-size: 1rem; }
.action span { font-size: .8rem; color: var(--muted); }
.action.a-pig svg { color: var(--pig-deep); }
.action.a-note svg { color: var(--note); }
.action.a-gold svg { color: var(--gold); }
.action.a-bad svg { color: var(--bad); }
.action:hover { border-color: var(--muted); }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: .85rem; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--pig-soft); border-color: var(--pig); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: .74rem; font-weight: 700; white-space: nowrap; }
.pill.ok { background: var(--ok-soft, var(--note-soft)); color: var(--note); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.gold { background: var(--gold-soft); color: var(--gold); }

/* ---------- formulário ---------- */
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.field textarea { min-height: 76px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--pig); outline-offset: 0; border-color: transparent; }
.field .hint { font-size: .74rem; color: var(--muted); }
.money-in { position: relative; }
.money-in::before { content: "R$"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .85rem; pointer-events: none; }
.money-in input { padding-left: 36px; font-variant-numeric: tabular-nums; }
.money-big input { font-family: var(--f-display); font-size: 1.6rem; font-weight: 800; padding-block: 12px; }
.money-big::before { font-size: 1rem; }
input[type="range"] { width: 100%; accent-color: var(--pig-deep); }
.check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--note); }

/* ---------- Jurandir ---------- */
.hero { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: center; }
.hero .pig-big svg { width: 116px; height: 98px; display: block; }
.bubble { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
.bubble::before { content: ""; position: absolute; left: -8px; top: 30px; width: 14px; height: 14px; background: var(--surface); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble .hi { font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; }
.bubble .say { font-size: .93rem; }
@media (prefers-reduced-motion: no-preference) {
  .pig-anim { animation: bob 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
  .pig-coin { animation: drop 3.4s ease-in infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
  @keyframes drop { 0%, 55% { transform: translateY(-10px); opacity: 0 } 65% { opacity: 1 } 85% { transform: translateY(8px); opacity: 1 } 100% { transform: translateY(12px); opacity: 0 } }
}

/* ---------- cédula ---------- */
.cedula { position: relative; overflow: hidden; border-radius: var(--r); padding: 18px; color: var(--ink); background:
    repeating-radial-gradient(circle at 92% 18%, transparent 0 9px, color-mix(in srgb, var(--note) 14%, transparent) 9px 10px),
    repeating-linear-gradient(115deg, transparent 0 14px, color-mix(in srgb, var(--note) 7%, transparent) 14px 15px),
    var(--note-soft);
  border: 1px solid color-mix(in srgb, var(--note) 35%, var(--line)); display: grid; gap: 12px; }
.cedula .serie { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .14em; color: var(--note); }
.cedula .valor { font-family: var(--f-display); font-weight: 800; font-size: 2.4rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.cedula .rodape { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .85rem; }
.track { position: relative; height: 16px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid color-mix(in srgb, var(--note) 30%, var(--line)); overflow: hidden; }
.track .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--pig), var(--gold) 60%, var(--note)); border-radius: 99px; }
.track .zero { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.track-labels { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .7rem; color: var(--muted); }

/* ---------- listas ---------- */
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { font-size: .8rem; color: var(--muted); }
.li .v { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.li .v.wrap { white-space: normal; text-align: right; max-width: 62%; overflow-wrap: anywhere; }
.dot { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; background: var(--surface-2); color: var(--muted); }
.dot svg { width: 18px; height: 18px; }
.dot.pig { background: var(--pig-soft); color: var(--pig-deep); }
.dot.note { background: var(--note-soft); color: var(--note); }
.dot.gold { background: var(--gold-soft); color: var(--gold); }
.dot.bad { background: var(--bad-soft); color: var(--bad); }

.env { display: grid; gap: 6px; padding-block: 8px; border-top: 1px solid var(--line); }
.env:first-child { border-top: 0; }
.env .row b { font-weight: 600; }

/* tabelas */
.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .84rem; font-variant-numeric: tabular-nums; min-width: 520px; }
.tbl th, .tbl td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-weight: 600; color: var(--muted); font-size: .76rem; }
.tbl tr.hl td { background: var(--gold-soft); }

/* ---------- tribunal ---------- */
.verdict { border-radius: var(--r); padding: 16px; display: grid; gap: 10px; border: 2px solid var(--line); background: var(--surface); }
.verdict.ok { border-color: var(--note); }
.verdict.warn { border-color: var(--warn); }
.verdict.bad { border-color: var(--bad); }
.verdict .vhead { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; }
.verdict .vhead svg { width: 84px; height: 72px; }
.verdict h3 { font-size: 1.3rem; }
.meter { height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--note), var(--gold), var(--bad)); position: relative; }
.meter i { position: absolute; top: -5px; width: 6px; height: 22px; border-radius: 3px; background: var(--ink); transform: translateX(-3px); transition: left .3s ease; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.fact b { font-family: var(--f-display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.fact span { font-size: .78rem; color: var(--muted); }
.rac { border-left: 3px solid var(--pig); padding: 6px 0 6px 12px; display: grid; gap: 2px; }
.rac b { font-size: .9rem; }
.rac p { font-size: .86rem; color: var(--muted); }

/* geladeira */
.frio { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; background:
    linear-gradient(180deg, color-mix(in srgb, #9CC9E8 16%, var(--surface)), var(--surface)); }
.frio.pronta { border-color: var(--gold); background: var(--gold-soft); }

/* ---------- sheet / modal ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(8, 18, 20, .5); display: grid; align-items: end; justify-items: center; }
.sheet { width: min(760px, 100%); max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); }
.sheet .grab { width: 44px; height: 5px; border-radius: 99px; background: var(--line); justify-self: center; margin-top: -6px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
@media (min-width: 820px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; max-height: 86vh; } }

.toast-wrap { position: fixed; z-index: 50; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; justify-items: center; gap: 6px; pointer-events: none; padding-inline: 16px; }
.toast { pointer-events: auto; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; box-shadow: 0 10px 24px -10px rgba(0, 0, 0, .5); max-width: 520px; }
.toast.xp { background: var(--gold); color: #251A00; }

/* SOS respiração */
.breath { width: 180px; height: 180px; border-radius: 50%; margin: 6px auto; display: grid; place-items: center; background: radial-gradient(circle, var(--pig-soft) 0 55%, transparent 56%); position: relative; }
.breath::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--pig); }
.breath span { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
@media (prefers-reduced-motion: no-preference) {
  .breath.go { animation: breathe 14s ease-in-out infinite; }
  @keyframes breathe { 0% { transform: scale(.72) } 28% { transform: scale(1) } 57% { transform: scale(1) } 100% { transform: scale(.72) } }
}

/* chat */
.chat { display: grid; gap: 10px; align-content: start; }
.chatbar { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; text-align: left; cursor: pointer; width: 100%; }
.chatbar svg { width: 26px; height: 26px; color: var(--pig-deep); flex: 0 0 auto; }
.chatbar > span { display: grid; gap: 2px; min-width: 0; font-size: .86rem; }
.chatbar b { font-family: var(--f-display); font-size: 1rem; }
.sheet.chat-sheet { height: 92vh; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; gap: 10px; overflow: hidden; }
.chat-scroll { overflow-y: auto; padding-right: 2px; display: grid; align-content: start; gap: 10px; }
.acoes { display: grid; gap: 4px; margin-top: 8px; }
.acao { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: .8rem; background: var(--note-soft); color: var(--ink); border-radius: 8px; padding: 4px 8px; }
.acao.desfeita { opacity: .55; text-decoration: line-through; }
.acao button { white-space: nowrap; border: 0; background: none; color: var(--note); font-weight: 700; cursor: pointer; font-size: .78rem; padding: 2px 4px; }
.chat-sugs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chat-sugs .chip { flex: 0 0 auto; }
.msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .93rem; }
.msg.me { justify-self: end; background: var(--ink); color: var(--paper); border-bottom-right-radius: 4px; }
.msg.time { justify-self: start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.chat-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.chat-in textarea { min-height: 48px; }

/* personas */
.persona { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
.persona .av { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; }
.persona ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: .9rem; }

/* conquistas */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.badge { border: 1px dashed var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; background: var(--surface); opacity: .55; }
.badge.on { border-style: solid; border-color: var(--gold); background: var(--gold-soft); opacity: 1; }
.badge b { font-family: var(--f-display); font-size: .95rem; }
.badge span { font-size: .76rem; color: var(--muted); }

details.acc { border-top: 1px solid var(--line); padding-block: 10px; }
details.acc:first-of-type { border-top: 0; }
details.acc summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 10px; list-style: none; }
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::after { content: "+"; color: var(--muted); font-weight: 800; }
details.acc[open] summary::after { content: "−"; }
details.acc .body { padding-top: 8px; display: grid; gap: 8px; font-size: .92rem; }

.chart-box { position: relative; height: 260px; }
.chart-box.sm { height: 200px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

.loading { min-height: 70vh; display: grid; place-items: center; text-align: center; gap: 10px; }
.loading svg { width: 140px; height: 118px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); font-size: .9rem; display: grid; gap: 8px; justify-items: center; }
.disclaimer { font-size: .76rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.kbd { font-family: var(--f-mono); font-size: .78rem; background: var(--surface-2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
.step { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: .85rem; background: var(--surface-2); border: 1px solid var(--line); }
.step.done .n { background: var(--note); color: var(--ink-inv); border-color: var(--note); }
.step.now .n { background: var(--pig); color: #2A0C15; border-color: var(--pig); }

<script>
/* ============================================================
   MOTOR FINANCEIRO — Missão 100K
   Funções puras: nada aqui mexe no DOM. Testável no Node.
   ============================================================ */
(function (root) {
  'use strict';

  const r2 = (x) => Math.round((Number(x) + Number.EPSILON) * 100) / 100;
  const pad = (n) => String(n).padStart(2, '0');
  const sum = (arr) => arr.reduce((a, b) => a + (Number(b) || 0), 0);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ---------- datas e meses ---------- */
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const MESES_LONGO = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function isoDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { const [y, m] = String(k).split('-').map(Number); return { y, m }; }
  function addM(k, n) { const { y, m } = parseKey(k); const t = y * 12 + (m - 1) + n; return Math.floor(t / 12) + '-' + pad((t % 12 + 12) % 12 + 1); }
  function diffM(a, b) { const A = parseKey(a), B = parseKey(b); return (B.y * 12 + B.m) - (A.y * 12 + A.m); }
  function labelM(k) { const { y, m } = parseKey(k); return MESES[m - 1] + '/' + String(y).slice(2); }
  function labelMLongo(k) { const { y, m } = parseKey(k); return MESES_LONGO[m - 1] + ' de ' + y; }
  function daysIn(k) { const { y, m } = parseKey(k); return new Date(y, m, 0).getDate(); }
  function keyOfISO(s) { return String(s).slice(0, 7); }
  function diffDias(aISO, bISO) { const a = new Date(aISO + 'T12:00:00'), b = new Date(bISO + 'T12:00:00'); return Math.round((b - a) / 86400000); }
  function addDiasISO(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); }
  function labelData(iso) { const [y, m, d] = iso.split('-').map(Number); return pad(d) + '/' + pad(m) + '/' + y; }
  function labelDataCurta(iso) { const [, m, d] = iso.split('-').map(Number); return d + ' ' + MESES[m - 1]; }

  /* ---------- formatação ---------- */
  const _brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const _brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0, minimumFractionDigits: 0 });
  const _num1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1, minimumFractionDigits: 0 });
  function brl(v) { return _brl.format(Number(v) || 0).replace(/ /g, ' '); }
  function brl0(v) { return _brl0.format(Math.round(Number(v) || 0)).replace(/ /g, ' '); }
  function brlK(v) {
    v = Number(v) || 0; const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1000000) return s + 'R$ ' + _num1.format(a / 1000000) + ' mi';
    if (a >= 10000) return s + 'R$ ' + _num1.format(a / 1000) + ' mil';
    return (v < 0 ? '−' : '') + brl0(a);
  }
  function pct(v, d = 1) { return (Number(v) || 0).toLocaleString('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: 0 }) + '%'; }
  function num(v, d = 1) { return (Number(v) || 0).toLocaleString('pt-BR', { maximumFractionDigits: d }); }

  /* ---------- tributos 2026 ---------- */
  // Faixas do INSS 2026 conferidas contra os holerites (ago/26 e set/26 batem ao centavo).
  const INSS_FAIXAS = [[1621.00, 0.075], [2902.84, 0.09], [4354.27, 0.12], [8475.55, 0.14]];
  function inss(base) {
    let prev = 0, t = 0;
    for (const [lim, al] of INSS_FAIXAS) { if (base > prev) t += (Math.min(base, lim) - prev) * al; prev = lim; }
    return r2(t);
  }
  // Tabela regressiva do IR sobre renda fixa (em vigor em 2026).
  function irAliquota(dias) { if (dias <= 180) return 0.225; if (dias <= 360) return 0.20; if (dias <= 720) return 0.175; return 0.15; }
  const taxaMes = (aa) => Math.pow(1 + aa / 100, 1 / 12) - 1;
  const taxaAno = (am) => (Math.pow(1 + am / 100, 12) - 1) * 100;

  /* ---------- renda ---------- */
  function liquidoSalario(s, bruto) {
    bruto = bruto ?? s.renda.bruto;
    return r2(bruto - inss(bruto) - (s.renda.descAlimentacao || 0) - (s.renda.descPrever || 0) - (s.renda.irrf || 0));
  }
  function extrasAtivos(s) { return sum((s.renda.extras || []).filter((e) => e.ativo !== false).map((e) => e.valor)); }
  function valorHora(s) { return r2(liquidoSalario(s) / (s.renda.horasMes || 220)); }

  /* ---------- dívidas ---------- */
  function dividaAtivaEm(d, k) {
    if (!d || !d.fim) return false;
    if (d.quitadaEm && diffM(d.quitadaEm, k) >= 0) return false; // quitada neste mês ou antes
    return diffM(k, d.fim) >= 0;
  }
  function parcelasRestantes(d, k) { // incluindo o mês k
    if (d.quitadaEm && diffM(d.quitadaEm, k) >= 0) return 0;
    return Math.max(0, diffM(k, d.fim) + 1);
  }
  function consignadosNoMes(s, k) { return r2(sum((s.dividas || []).filter((d) => dividaAtivaEm(d, k)).map((d) => d.parcela))); }
  function saldoDividas(s, k) { return r2(sum((s.dividas || []).map((d) => d.parcela * parcelasRestantes(d, k)))); }
  // Valor presente de n parcelas a uma taxa mensal i (quanto custaria quitar hoje)
  function valorPresente(parcela, n, iMes) { if (n <= 0) return 0; if (iMes <= 0) return parcela * n; return parcela * (1 - Math.pow(1 + iMes, -n)) / iMes; }
  // Taxa implícita: dado o valor de quitação que o banco ofereceu, qual juros mensal está embutido?
  function taxaImplicita(parcela, n, pv) {
    if (!(parcela > 0) || !(n > 0) || !(pv > 0)) return null;
    if (pv >= parcela * n) return 0;
    let lo = 0.000001, hi = 0.5;
    for (let it = 0; it < 120; it++) { const mid = (lo + hi) / 2; if (valorPresente(parcela, n, mid) > pv) lo = mid; else hi = mid; }
    return ((lo + hi) / 2) * 100;
  }
  function diaLiberdade(s) { const ativos = (s.dividas || []).filter((d) => !d.quitadaEm); if (!ativos.length) return null; return ativos.map((d) => d.fim).sort().pop(); }

  /* ---------- carro ---------- */
  function pmt(pv, iMes, n) { if (pv <= 0 || n <= 0) return 0; if (iMes <= 0) return pv / n; return pv * iMes / (1 - Math.pow(1 + iMes, -n)); }
  function saldoFinanciamento(pv, iMes, n, pagas) { if (pagas >= n) return 0; const p = pmt(pv, iMes, n); return valorPresente(p, n - pagas, iMes); }
  function custoCarro(c) {
    const fin = Math.max(0, c.preco - c.entrada);
    const i = (c.taxaAM || 0) / 100;
    const parcela = c.financiar === false ? 0 : pmt(fin, i, c.prazo);
    const juros = c.financiar === false ? 0 : parcela * c.prazo - fin;
    const ipvaMes = c.preco * (c.ipvaPct || 0) / 100 / 12;
    const seguroMes = (c.seguroAno || 0) / 12;
    const combustivelMes = (c.kmMes || 0) / Math.max(1, c.consumo || 1) * (c.gasolina || 0);
    const manutencaoMes = c.manutencaoMes || 0;
    const outrosMes = c.outrosMes || 0;
    const posseMes = ipvaMes + seguroMes + combustivelMes + manutencaoMes + outrosMes;
    const depreciacaoMes = c.preco * (c.depreciacaoAA || 0) / 100 / 12;
    const caixaMes = parcela + posseMes - (c.economiaTransporte || 0);
    return {
      financiado: r2(fin), parcela: r2(parcela), juros: r2(juros), totalPago: r2(c.entrada + parcela * c.prazo),
      ipvaMes: r2(ipvaMes), seguroMes: r2(seguroMes), combustivelMes: r2(combustivelMes), manutencaoMes: r2(manutencaoMes), outrosMes: r2(outrosMes),
      posseMes: r2(posseMes), depreciacaoMes: r2(depreciacaoMes), caixaMes: r2(caixaMes),
      custoRealMes: r2(posseMes + depreciacaoMes + (c.prazo ? juros / c.prazo : 0)),
    };
  }

  /* ---------- projeção mês a mês ---------- */
  // eventos extras: [{k:'2026-11', v: 300, label:'...'}]
  function projetar(s, o = {}) {
    const inicio = o.inicio || keyOfISO(s._hoje || isoDate(new Date()));
    const N = o.meses || 72;
    const rAA = o.taxaAA ?? s.invest.taxaLiquidaAA;
    const r = taxaMes(rAA);
    const fgR = taxaMes(s.invest.fgtsAA ?? 4);
    let B = Number(s.invest.saldo) || 0;
    let fg = Number(s.invest.fgts) || 0;
    let bruto = Number(s.renda.bruto) || 0;
    const fixosTot = sum((s.fixos || []).map((f) => f.valor));
    const envTot = sum((s.envelopes || []).map((e) => e.valor)) + (o.ajusteGastos || 0);
    const extraRendaMes = (o.rendaExtra || 0);
    const car = o.carro ? s.carro : null;
    const cc = car ? custoCarro(car) : null;
    const carFin = car ? Math.max(0, car.preco - car.entrada) : 0;
    const carI = car ? (car.taxaAM || 0) / 100 : 0;
    const out = [];
    for (let i = 0; i < N; i++) {
      const k = addM(inicio, i);
      const { m } = parseKey(k);
      if (i > 0 && s.renda.reajusteAA > 0 && m === Number(s.renda.mesReajuste || 5)) bruto = r2(bruto * (1 + s.renda.reajusteAA / 100));
      if (o.reajusteExtraPct && i === (o.reajusteExtraEm ?? 0)) bruto = r2(bruto * (1 + o.reajusteExtraPct / 100));
      const inssM = inss(bruto);
      const liq = bruto - inssM - (s.renda.descAlimentacao || 0) - (s.renda.descPrever || 0) - (s.renda.irrf || 0);
      const extras = extrasAtivos(s) + extraRendaMes;
      let bonus = 0; const bonusDesc = [];
      const pular = s.renda.decimoPular || [];
      if (s.renda.decimo !== false) {
        if (m === 11 && !pular.includes(k)) { bonus += bruto / 2; bonusDesc.push('13º (1ª parcela)'); }
        if (m === 12 && !pular.includes(k)) { bonus += bruto / 2 - inssM; bonusDesc.push('13º (2ª parcela)'); }
      }
      if (s.renda.mesFerias && m === Number(s.renda.mesFerias)) {
        const terco = bruto * ((s.renda.diasFerias || 30) / 30) / 3 * 0.86;
        bonus += terco; bonusDesc.push('1/3 de férias');
      }
      const renda = liq + extras + bonus;
      const consig = consignadosNoMes(s, k);
      let gastos = fixosTot + envTot;
      // eventos pontuais
      let eventos = 0; const evDesc = [];
      for (const c of (s.compromissos || [])) {
        if (c.pago) continue;
        let ck = keyOfISO(c.data); if (o.moverAtrasados !== false && diffM(ck, inicio) > 0) ck = inicio;
        if (ck === k) { eventos += Number(c.valor) || 0; evDesc.push(c.nome); }
      }
      for (const g of (s.metas || [])) {
        if (g.feito) continue;
        let gk = keyOfISO(g.data); if (o.moverAtrasados !== false && diffM(gk, inicio) > 0) gk = inicio;
        if (gk === k) { const v = Math.max(0, (Number(g.valor) || 0) - (Number(g.guardado) || 0)); eventos += v; if (v) evDesc.push(g.nome); }
      }
      for (const d of (s.dividas || [])) {
        if (d.quitadaEm === k && d.valorQuitacao && d.quitacaoPlanejada) { eventos += Number(d.valorQuitacao); evDesc.push('Quitação ' + d.credor); }
      }
      for (const e of (o.eventos || [])) { if (e.k === k) { eventos += Number(e.v) || 0; if (e.label) evDesc.push(e.label); } }
      // carro
      let carVal = 0, carLoan = 0, carCaixa = 0;
      if (car) {
        const dk = diffM(car.mesCompra, k);
        if (dk === 0) { eventos += car.entrada; evDesc.push('Entrada do carro'); }
        if (dk >= 0) {
          if (car.financiar !== false && dk >= 1 && dk <= car.prazo) carCaixa += cc.parcela;
          carCaixa += cc.posseMes - (car.economiaTransporte || 0);
          carVal = car.preco * Math.pow(1 - (car.depreciacaoAA || 0) / 100, (dk + 1) / 12);
          if (car.financiar === false) carLoan = 0;
          else carLoan = dk >= 1 ? saldoFinanciamento(carFin, carI, car.prazo, Math.min(dk, car.prazo)) : carFin;
        }
        gastos += carCaixa;
      }
      const sobra = renda - consig - gastos - eventos;
      B = B * (1 + r) + sobra;
      fg = fg * (1 + fgR) + bruto * 0.08 + (m === 12 && s.renda.decimo !== false ? bruto * 0.08 : 0);
      const kNext = addM(k, 1);
      const divRest = saldoDividas(s, kNext);
      let compRest = 0;
      for (const c of (s.compromissos || [])) { if (c.pago) continue; let ck = keyOfISO(c.data); if (diffM(ck, inicio) > 0) ck = inicio; if (diffM(k, ck) > 0) compRest += Number(c.valor) || 0; }
      const patFin = B - divRest - compRest - carLoan;
      const pat = patFin + (s.perfil.contarFgts ? fg : 0) + (car && o.contarCarro !== false ? carVal : 0);
      out.push({ k, i, bruto: r2(bruto), liq: r2(liq), extras: r2(extras), bonus: r2(bonus), bonusDesc, renda: r2(renda), consig, gastos: r2(gastos), eventos: r2(eventos), evDesc, sobra: r2(sobra), investido: r2(B), divRest, compRest, fgts: r2(fg), carVal: r2(carVal), carLoan: r2(carLoan), patFin: r2(patFin), pat: r2(pat) });
    }
    return out;
  }

  function patrimonioHoje(s) {
    const k = keyOfISO(s._hoje || isoDate(new Date()));
    const invest = Number(s.invest.saldo) || 0;
    const div = saldoDividas(s, k);
    const comp = sum((s.compromissos || []).filter((c) => !c.pago).map((c) => c.valor));
    const fg = s.perfil.contarFgts ? (Number(s.invest.fgts) || 0) : 0;
    return { invest, div, comp, fgts: Number(s.invest.fgts) || 0, contaFgts: !!s.perfil.contarFgts, total: r2(invest - div - comp + fg) };
  }

  // Primeiro mês (fracionário) em que a série cruza a meta.
  function cruzaMeta(proj, meta, campo = 'pat', base0 = null) {
    let prev = base0;
    for (let i = 0; i < proj.length; i++) {
      const v = proj[i][campo];
      if (v >= meta) {
        let frac = 1;
        if (prev != null && v !== prev) frac = clamp((meta - prev) / (v - prev), 0, 1);
        return { idx: i - 1 + frac + (prev == null ? 0 : 0), mes: proj[i].k, i };
      }
      prev = v;
    }
    return null;
  }

  function idadeEm(s, k) { // idade aproximada no mês k, a partir do mês do aniversário de 32
    const k32 = s.perfil.aniversario32; if (!k32) return null;
    const d = diffM(k32, k); return 32 + Math.floor(d / 12);
  }

  /* ---------- impacto de uma compra ---------- */
  function simularCompra(s, c) {
    const hojeK = keyOfISO(s._hoje);

function deepFill(alvo, base) {

}

    if (this.writing[id]) { this.again[id] = true; return; }

    }
    this.writing[id] = false;
    if (this.again[id]) { this.again[id] = false; return this.flush(id); }
    this.dirty[id] = false;
  },

/* ---------- gamificação ---------- */
function ganharXP(n, motivo) {
  const antes = M.nivel(S.game.xp).n;
  S.game.xp += Math.round(n);
  toast(`+${Math.round(n)} XP · ${motivo}`, 'xp');

  if (depois.n > antes) setTimeout(() => abrirSheetDepois(`<div class="loading" style="min-height:auto">${jurandir('feliz')}<div class="eyebrow">Subiu de nível</div><h2>Nível ${depois.n}: ${esc(depois.nome)}</h2><p class="muted">O Jurandir está orgulhoso. Ele não fala, mas você sabe.</p><button class="btn primary" data-act="sheet-close">Bora</button></div>`), 400);
}
function conquistar(id) {
  if (S.game.conquistas[id]) return;
  const c = CONQUISTAS.find((x) => x.id === id); if (!c) return;
  S.game.conquistas[id] = hojeISO(); S.game.xp += 25;
  setTimeout(() => toast('Conquista desbloqueada: ' + c.nome + ' (+25 XP)', 'xp'), 600);
}
function checarConquistas() {
  const g = S.game;
  if (g.streak >= 3) conquistar('streak-3');
  if (g.streak >= 7) conquistar('streak-7');
  if (g.streak >= 30) conquistar('streak-30');
  if (g.resgatado > 0) conquistar('resisti-1');
  if (g.resgatado >= 500) conquistar('resgate-500');
  if (g.resgatado >= 2000) conquistar('resgate-2000');
  if (Object.keys(g.licoes || {}).length >= 5) conquistar('licoes-5');
  if ((S.cartaFuturo || '').trim().length > 30) conquistar('carta');
  const jose = (S.compromissos || []).find((c) => c.id === 'jose'); if (jose && jose.pago) conquistar('jose');
  const maes = (S.compromissos || []).filter((c) => c.id.startsWith('mae')); if (maes.length && maes.every((c) => c.pago)) conquistar('mae');
  const k = hojeK();
  if ((S.dividas || []).some((d) => d.quitadaEm || M.diffM(d.fim, k) > 0)) conquistar('quitou');
  S._hoje = hojeISO();
  const p = M.patrimonioHoje(S).total;
  if (p > 0) conquistar('positivo');
  if (p >= 25000) conquistar('meta-25');
  if (p >= 50000) conquistar('meta-50');
  if (p >= S.perfil.metaValor) conquistar('meta-100');
}
function fezCheckinHoje() { return S.game.ultimoCheckin === hojeISO(); }
function fazerCheckin(xp = 10, motivo = 'check-in do dia') {
  if (fezCheckinHoje()) return false;
  const g = S.game, hoje = hojeISO();
  if (!g.ultimoCheckin) g.streak = 1;
  else {
    const gap = M.diffDias(g.ultimoCheckin, hoje);
    if (gap === 1) g.streak++;
    else if (gap > 1) {
      const precisa = gap - 1;
      if (g.escudos >= precisa) { g.escudos -= precisa; g.streak++; setTimeout(() => toast(`Escudo usado: sua sequência sobreviveu a ${precisa} dia(s) sem check-in.`), 900); }
      else { g.streak = 1; setTimeout(() => toast('Sequência recomeçou. Recomeçar também conta, e seu XP continua todo aqui.'), 900); }
    }

  g.ultimoCheckin = hoje;
  g.melhorStreak = Math.max(g.melhorStreak || 0, g.streak);
  if (g.streak % 7 === 0) { g.escudos = Math.max(g.escudos || 0, Math.min(2, (g.escudos || 0) + 1)); setTimeout(() => toast('Ganhou um escudo de sequência.'), 1300); }

}

/* ---------- lançamentos ---------- */
function addItem(t) {
  const k = t.d.slice(0, 7); mesDoc(k).itens.push(t); Store.salvarMes(k);
}
function caixaAtivo() { return !!(S.caixa && S.caixa.saldo != null && S.caixa.saldo !== ''); }
function deltaCaixa(tipo, forma, v) {
  if (!caixaAtivo()) return 0;
  if (tipo === 'gasto') return ['credito', 'parcelado', 'folha'].includes(forma) ? 0 : -v;
  if (tipo === 'aporte') return -v;
  if (tipo === 'resgate' || tipo === 'entrada') return v;
  return 0;
}
function mexerCaixa(d) { if (d && caixaAtivo()) S.caixa.saldo = Math.round((Number(S.caixa.saldo) + d) * 100) / 100; }
function registrarLancamento({ tipo, valor, cat, desc, data, forma, parcelas, humor }) {
  valor = Math.round(parseBR(valor) * 100) / 100;
  if (!(valor > 0)) { toast('Digite um valor maior que zero.'); return false; }
  data = data || hojeISO();
  const refs = [];
  if (tipo === 'gasto' && forma === 'parcelado' && parcelas > 1) {
    const p = Math.round(valor / parcelas * 100) / 100; const grupo = novoId();
    for (let i = 0; i < parcelas; i++) {
      const k = M.addM(data.slice(0, 7), i);
      const d = i === 0 ? data : k + '-' + data.slice(8, 10).replace(/^(29|3[01])$/, '28');
      const t = { id: novoId(), tipo, v: p, cat, desc: (desc || catNome(cat)) + ` (${i + 1}/${parcelas})`, d, forma, humor: i === 0 ? humor : '', grupo };
      addItem(t); refs.push({ k, id: t.id });
    }
  } else {
    const cx = deltaCaixa(tipo, forma, valor);
    const t = { id: novoId(), tipo, v: valor, cat: tipo === 'gasto' ? cat : tipo, desc: desc || '', d: data, forma: forma || '', humor: humor || '' };
    if (cx) { t.cx = cx; mexerCaixa(cx); }
    addItem(t); refs.push({ k: data.slice(0, 7), id: t.id });
  }
  if (tipo === 'aporte') { S.invest.saldo = Math.round((Number(S.invest.saldo) + valor) * 100) / 100; conquistar('aporte'); }
  if (tipo === 'resgate') S.invest.saldo = Math.round((Number(S.invest.saldo) - valor) * 100) / 100;
  if (tipo === 'gasto') conquistar('primeiro-registro');
  invalidar(); salvarApp();
  return refs;
}
function apagarItem(k, id) {
  const doc = mesDoc(k); const t = doc.itens.find((x) => x.id === id); if (!t) return false;
  doc.itens = doc.itens.filter((x) => x.id !== id);
  if (t.tipo === 'aporte') S.invest.saldo = Math.round((S.invest.saldo - t.v) * 100) / 100;
  if (t.tipo === 'resgate') S.invest.saldo = Math.round((S.invest.saldo + t.v) * 100) / 100;
  if (t.tipo === 'resisti') S.game.resgatado = Math.max(0, Math.round((S.game.resgatado - t.v) * 100) / 100);
  if (t.cx) mexerCaixa(-t.cx);
  Store.salvarMes(k); invalidar(); salvarApp(); return true;
}

/* ---------- caixa até o salário + limite do dia ---------- */
function caixaInfo() {
  if (!caixaAtivo()) return null;
  const c = S.caixa, hoje = hojeISO(), k = hojeK();
  const ate = c.proximoSalario && c.proximoSalario > hoje ? c.proximoSalario : null;
  const limite = ate || M.addDiasISO(hoje, 30);
  const pend = S.compromissos.filter((x) => !x.pago && (x.data || hoje) <= limite);
  const pagar = M.sum(pend.map((x) => x.valor));
  const livre = Math.round((Number(c.saldo) - pagar) * 100) / 100;
  const dias = ate ? Math.max(1, M.diffDias(hoje, ate)) : null;
  const hojeCx = -M.sum(((MES[k] && MES[k].itens) || []).filter((t) => t.d === hoje && t.tipo === 'gasto' && t.cx < 0).map((t) => t.cx));
  const base = dias ? (livre + hojeCx) / dias : livre + hojeCx;
  return { saldo: Number(c.saldo), pagar, pend, livre, ate, dias, base: Math.max(0, base), hoje: base - hojeCx, amanha: dias ? (dias > 1 ? Math.max(0, livre) / (dias - 1) : null) : null, atualizadoEm: c.atualizadoEm };
}
function limiteDoDia() {
  const hoje = hojeISO(), k = hojeK();
  const pg = M.podeGastarHoje(S, MES[k], hoje); const cx = caixaInfo();
  let r = { hoje: pg.hoje, base: pg.porDia, amanha: pg.diasRest > 1 ? Math.max(0, pg.restante) / (pg.diasRest - 1) : null, fonte: 'envelopes', pg, cx };
  if (cx && cx.hoje < r.hoje) { r.hoje = cx.hoje; r.base = cx.base; r.fonte = 'conta'; }
  if (cx && cx.amanha != null && (r.amanha == null || cx.amanha < r.amanha)) r.amanha = cx.amanha;
  return r;
}

function eventosProximos(dias = 45) {
  const hoje = hojeISO(), lim = M.addDiasISO(hoje, dias), ev = [];
  const add = (d, t, s, tipo) => { if (d >= hoje && d <= lim) ev.push({ d, t, s, tipo }); };
  for (const c of S.compromissos) if (!c.pago) add(c.data < hoje ? hoje : c.data, c.nome, (c.data < hoje ? 'atrasado · ' : '') + M.brl(c.valor), 'bad');
  for (const g of S.metas) if (!g.feito) add(g.data, g.nome, 'plano de ' + M.brl(g.valor), 'gold');
  const y = Number(hoje.slice(0, 4)), pular = S.renda.decimoPular || [];
  if (S.renda.decimo !== false) for (const yy of [y, y + 1]) {
    if (!pular.includes(yy + '-11')) add(yy + '-11-30', '13º salário, 1ª parcela', '≈ ' + M.brl0(S.renda.bruto / 2) + ' (prazo legal)', 'note');
    if (!pular.includes(yy + '-12')) add(yy + '-12-20', '13º salário, 2ª parcela', '≈ ' + M.brl0(S.renda.bruto / 2 - M.inss(S.renda.bruto)) + ' (prazo legal)', 'note');
  }
  const fins = {};
  for (const d of S.dividas) if (!d.quitadaEm) (fins[d.fim] = fins[d.fim] || []).push(d);
  for (const [fim, ds] of Object.entries(fins)) add(fim + '-28', 'Última parcela: ' + ds.map((d) => d.apelido || d.credor).join(', '), '+' + M.brl(M.sum(ds.map((d) => d.parcela))) + ' por mês livres, direto para o aporte', 'note');
  for (const d of ['2026-12-09', '2027-01-27']) add(d, 'Copom decide a Selic', 'Mexe no rendimento da renda fixa', 'info');
  const dow = new Date(hoje + 'T12:00:00').getDay();
  add(M.addDiasISO(hoje, (7 - dow) % 7), 'Revisão de domingo', '5 minutos, +50 XP', 'info');
  for (const g of S.geladeira) if (g.status === 'esperando') add(g.liberaEm.slice(0, 10), 'Geladeira libera: ' + g.item, M.brl(g.preco), 'gold');
  return ev.sort((a, b) => a.d.localeCompare(b.d));
}

/* ---------- objetivos: vários sonhos, cada um com valor, prazo e rendimento ---------- */
function optsObjetivo() { return { hojeK: hojeK(), taxaPadraoAA: S.invest.taxaLiquidaAA ?? 10 }; }
function mesesTxt(n) { if (n == null) return '—'; if (n === 0) return 'já'; const a = Math.floor(n / 12), m = n % 12; return [a ? a + (a === 1 ? ' ano' : ' anos') : '', m ? m + (m === 1 ? ' mês' : ' meses') : ''].filter(Boolean).join(' e '); }
function objetivosAtivos() { return (S.objetivos || []).filter((g) => !g.feito); }
function objetivoPrincipal() { const at = objetivosAtivos().filter((g) => (Number(g.valor) || 0) > 0); return at.find((g) => g.principal) || at.filter((g) => g.prazo).sort((a, b) => String(a.prazo).localeCompare(String(b.prazo)))[0] || at[0] || null; }
function resumoObjetivos() {
  S._hoje = hojeISO(); const o = optsObjetivo(); const k = o.hojeK;
  const cap = M.capacidadeMensal(S, k);
  const ativos = objetivosAtivos();
  const planos = ativos.map((g) => M.planoObjetivo(g, o));
  const planejado = M.r2(M.sum(planos.filter((p) => !p.completo).map((p) => p.aporte)));
  const separado = M.r2(M.sum((S.objetivos || []).filter((g) => !g.feito).map((g) => Number(g.guardado) || 0)));
  // quando a capacidade sobe (consignados terminando)
  const fins = [...new Set(S.dividas.filter((d) => !d.quitadaEm && d.fim && M.diffM(k, d.fim) >= 0).map((d) => M.addM(d.fim, 1)))].sort();
  const marcos = []; let ult = cap.agora;
  for (const kk of fins) { const v = M.capacidadeMensal(S, kk).agora; if (v - ult >= 150) { marcos.push({ k: kk, v }); ult = v; } }
  return { cap, planos, planejado, livre: M.r2(cap.agora - planejado), separado, marcos };
}
function viewObjetivos() {

function chatHTML() {
  return UI.chat.map((m) => `<div class="msg ${m.role === 'user' ? 'me' : 'time'}">${m.role === 'assistant' && m.pending && !m.content ? 'Pensando…' : esc(m.content)}${m.erro ? `<div class="tiny" style="color:var(--bad);margin-top:6px">${esc(m.erro)}</div>` : ''}</div>`).join('');
}
async function enviarChat(texto) {
  texto = (texto || '').trim(); if (!texto || UI.chatBusy || !UI.ia) return;
  UI.chat.push({ role: 'user', content: texto });
  const resp = { role: 'assistant', content: '', pending: true }; UI.chat.push(resp);
  UI.chatBusy = true; render();
  const ctl = new AbortController(); UI.chatCtl = ctl;
  const hist = UI.chat.filter((m) => !m.pending && m.content).slice(-10).map((m) => ({ role: m.role, content: m.content }));
  try {
    const { text } = await UI.ia([{ role: 'user', content: REGRAS_IA + contextoIA() }, ...hist], { cache: false, signal: ctl.signal, onText: ({ text }) => { resp.content = text; const el = $('#chat'); if (el) el.innerHTML = chatHTML(); } });
    resp.content = text;
  } catch (e) {
    resp.content = (e && e.text) || '';
    if (e && e.code !== 'cancelled') resp.erro = msgErroIA(e.code);
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) UI.ia = false;
  }
  resp.pending = false; UI.chatBusy = false; UI.chatCtl = null;
  if (!resp.content && !resp.erro) UI.chat.pop();
  render();
  const el = $('#chat'); if (el && el.lastElementChild) el.lastElementChild.scrollIntoView({ block: 'nearest', behavior: reduzMov() ? 'auto' : 'smooth' });
}

function padroesComportamento() {
  const hoje = hojeISO(), ini = M.addDiasISO(hoje, -60);
  const todos = Object.values(MES).flatMap((d) => d.itens || []).filter((t) => t.d >= ini && t.d <= hoje);
  const gastos = todos.filter((t) => t.tipo === 'gasto');
  if (!gastos.length) return 'sem gastos registrados nos últimos 60 dias';
  const porCat = {}, porDow = [0, 0, 0, 0, 0, 0, 0], porHumor = {}, descs = {};
  for (const t of gastos) {
    const c = catNome(t.cat); porCat[c] = (porCat[c] || 0) + t.v;
    porDow[new Date(t.d + 'T12:00:00').getDay()] += t.v;
    if (t.humor) porHumor[t.humor] = (porHumor[t.humor] || 0) + t.v;
    const ds = semAcento(t.desc || '').replace(/\s*\(\d+\/\d+\)$/, ''); if (ds) descs[ds] = (descs[ds] || 0) + 1;
  }
  const total = M.sum(gastos.map((t) => t.v));
  const primeiro = gastos.map((t) => t.d).sort()[0]; const nDias = Math.max(1, M.diffDias(primeiro, hoje) + 1);
  const dias = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(([k, v]) => ({ [k]: Math.round(v * 100) / 100 }));
  return {
    periodo: `${M.labelData(primeiro)} a ${M.labelData(hoje)}`, totalGasto: Math.round(total * 100) / 100, mediaPorDia: Math.round(total / nDias * 100) / 100,
    porCategoria: top(porCat, 6), diaDaSemanaQueMaisGasta: dias[porDow.indexOf(Math.max(...porDow))], gatilhosEmocionais: top(porHumor, 4),
    comprasFrequentes: top(descs, 5), resistido: Math.round(M.sum(todos.filter((t) => t.tipo === 'resisti').map((t) => t.v)) * 100) / 100,
    desistenciasNaGeladeira: S.geladeira.filter((g) => g.status === 'desistiu').length, ultimoDiaFechado: S.game.ultimoFechamento || null,
    intencoesDasRevisoes: S.revisoes.slice(-2).map((r) => r.intencao).filter(Boolean),
  };
}

    let v = m[1].includes(',') ? parseFloat(m[1].replace(/\./g, '').replace(',', '.')) : /^\d{1,3}(\.\d{3})+$/.test(m[1]) ? parseFloat(m[1].replace(/\./g, '')) : parseFloat(m[1]);

  }

}

/* ---------------- rotina diária: limite que acumula e chefões ---------------- */
function rotinaDiaria() {
  try { fecharDia(); verificarChefoes(); } catch (e) { console.warn('rotina diária', e); }
}
function fecharDia() {
  const g = S.game, hoje = hojeISO(), ld = g.limiteDia;
  if (ld && ld.data === hoje) return;
  if (ld && ld.data && ld.data < hoje) {
    const k = ld.data.slice(0, 7); const envIds = S.envelopes.map((e) => e.id);
    const gasto = M.sum(((MES[k] && MES[k].itens) || []).filter((t) => t.tipo === 'gasto' && t.d === ld.data && envIds.includes(t.cat)).map((t) => t.v));
    const sobra = Math.round((ld.limite - gasto) * 100) / 100;
    let bonus = 0;
    if (sobra >= 0 && ld.limite > 0) { g.diasNoLimite = (g.diasNoLimite || 0) + 1; bonus = Math.min(50, Math.max(5, Math.round(sobra / 2))); g.xp += bonus; }
    g.ultimoFechamento = { data: ld.data, limite: ld.limite, gasto: Math.round(gasto * 100) / 100, sobra, bonus };
    if (ld.data === M.addDiasISO(hoje, -1)) setTimeout(() => toast(sobra >= 0 ? `Ontem: ${M.brl(sobra)} abaixo do limite. +${bonus} XP, e o limite de hoje subiu.` : `Ontem passou ${M.brl(-sobra)} do limite. Hoje é dia de recuperar.`, sobra >= 0 ? 'xp' : ''), 600);
  }
  g.limiteDia = { data: hoje, limite: Math.round(limiteDoDia().base * 100) / 100 };
  invalidar(); salvarApp();
}
function verificarChefoes() {
  const g = S.game; g.fase = g.fase || 0; g.fasesVencidas = g.fasesVencidas || {};
  const vencidas = [];
  while (g.fase < FASES.length) {
    const f = FASES[g.fase]; const p = progressoFase(f);
    if (p.dano < p.hp - 0.005) break;
    g.fasesVencidas[f.id] = hojeISO(); g.xp += 100 * (g.fase + 1);
    if (f.id === 'despertar') g.escudos = Math.min(3, (g.escudos || 0) + 1);
    vencidas.push(f); g.fase++;
  }
  if (!vencidas.length) return;
  salvarApp();
  const prox = FASES[g.fase];
  setTimeout(() => abrirSheetDepois(`<div class="loading" style="min-height:auto"><div style="width:120px;margin:0 auto">${monstro(vencidas[vencidas.length - 1], true)}</div>
    <div class="eyebrow">Chefão derrotado</div><h2>${vencidas.map((v) => esc(v.chefe)).join(', ')}</h2>
    <p class="muted">${vencidas.length > 1 ? 'Você venceu ' + vencidas.length + ' fases de uma vez. ' : ''}Recompensa: ${esc(vencidas.map((v) => v.premio).join(' · '))}.</p>
    ${prox ? `<p class="small">Próxima fase: <b>${esc(prox.nome)}</b>. Chefão: ${esc(prox.chefe)}.</p>` : '<p class="small"><b>Jornada completa.</b></p>'}
    <button class="btn primary" data-act="sheet-close">Bora</button></div>`), 450);
}

async function exportar() {
  const data = JSON.stringify({ app: 'missao100k', versao: 1, exportadoEm: new Date().toISOString(), state: limpar(S), meses: MES, chat: CHAT.slice(-40) }, null, 2);
  const nome = 'missao100k-backup-' + hojeISO() + '.json';
  if (STANDALONE) {
    const arq = new File([data], nome, { type: 'application/json' });
    S.ultimoBackup = hojeISO(); salvarApp();
    try { if (navigator.canShare && navigator.canShare({ files: [arq] })) { await navigator.share({ files: [arq], title: 'Backup Missão 100K' }); toast('Backup pronto. Guarde no Drive ou no e-mail.'); render(); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(arq); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Backup baixado.'); render(); return;
  }
  if (UI.downloads) { try { await UI.downloads.save({ filename: nome, data }); toast('Backup salvo.'); return; } catch (e) { if (e && e.code === 'declined') return; } }
  const out = $('#exp-out');
  if (out) out.innerHTML = `<div class="field"><label for="exp-txt">Copie o texto abaixo e guarde num arquivo .json</label><textarea id="exp-txt" readonly style="min-height:140px">${esc(data)}</textarea></div><button class="btn sm" data-act="copiar-exp">Copiar</button>`;
}

function aplicarAjustes(a) {
  const itens = [];
  if (a.jurandir && typeof a.jurandir === 'object') itens.push('tom e perfil do Jurandir');
  if (a.moradia && typeof a.moradia === 'object') itens.push('moradia');
  if (Array.isArray(a.objetivos) && a.objetivos.length) itens.push(a.objetivos.length + (a.objetivos.length === 1 ? ' objetivo' : ' objetivos'));
  if (!itens.length) { toast('Esse pacote não tem ajustes que eu conheça.'); return; }
  confirmar('Aplicar ajustes?', 'Muda só: ' + itens.join(', ') + '. Seus lançamentos e o resto ficam como estão.', 'Aplicar', () => {
    if (a.jurandir) { S.jurandir = S.jurandir || {}; if (['gentil', 'direto', 'amigo'].includes(a.jurandir.tom)) S.jurandir.tom = a.jurandir.tom; if (typeof a.jurandir.perfil === 'string') S.jurandir.perfil = a.jurandir.perfil.slice(0, 4000); }
    if (a.moradia) { S.moradia = S.moradia || {}; for (const k of ['aluguel', 'auxilio']) { const v = Number(a.moradia[k]); if (isFinite(v) && v >= 0) S.moradia[k] = v; } }
    if (Array.isArray(a.objetivos)) { S.objetivos = S.objetivos || []; for (const g of a.objetivos) { if (!g || !g.nome || S.objetivos.some((x) => semAcento(x.nome) === semAcento(g.nome))) continue; S.objetivos.push({ id: novoId(), nome: String(g.nome).slice(0, 60), valor: Number(g.valor) || 0, guardado: Number(g.guardado) || 0, prazo: /^\d{4}-\d{2}$/.test(g.prazo || '') ? g.prazo : null, aporteMes: Number(g.aporteMes) || 0, taxaAA: g.taxaAA == null ? null : Number(g.taxaAA), principal: false, feito: false, criadoEm: hojeISO() }); } }
    invalidar(); salvarApp(); render(); toast('Ajustes aplicados.');
  });
}
function importar(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let obj = null; try { obj = JSON.parse(r.result); } catch (err) { obj = null; }
    if (obj && obj.tipo === 'missao100k-ajustes' && obj.ajustes && typeof obj.ajustes === 'object') { aplicarAjustes(obj.ajustes); return; }
    if (!obj || !obj.state) { toast('Esse arquivo não é um backup do Missão 100K.'); return; }
    confirmar('Restaurar backup?', 'Isso substitui as configurações e os lançamentos atuais pelos do arquivo.', 'Restaurar', () => {
      S = migrar(obj.state); MES = obj.meses || {}; if (Array.isArray(obj.chat)) CHAT = obj.chat;
      Store.salvar('app'); Store.salvar('chat'); for (const k of Object.keys(MES)) Store.salvarMes(k);
      invalidar(); render(); toast('Backup restaurado.');
    });
  };
  r.readAsText(f);
}

/* ---------------- tema e inicialização ---------------- */
function aplicarTema() {
  let t = 'auto'; try { t = localStorage.getItem('m100k-tema') || 'auto'; } catch (e) { t = 'auto'; }
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
window.addEventListener('hashchange', () => {
  if (UI._ignorarHash) { UI._ignorarHash = false; return; }
  const h = location.hash.slice(1); if (TABS.some(([id]) => id === h) && h !== UI.tab) { UI.tab = h; render(); }
});
if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const f = () => { if (S && Object.keys(UI.charts).length) render(); }; if (mq.addEventListener) mq.addEventListener('change', f); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && !$('#sheet-bg')) { invalidar(); render(); } });
(function boot() {
  aplicarTema();
  $('#fab').innerHTML = ic('chat') + '<span>Jurandir</span>';
  const h = location.hash.slice(1); if (TABS.some(([id]) => id === h)) UI.tab = h;
  if (STANDALONE) { UI.ia = false; atualizarMercadoStandalone(); }
  else if (window.claude && typeof claude.use === 'function') {
    claude.use('sample').then((f) => { UI.ia = f || false; if (f && f.limits) f.limits().then((l) => { UI.iaTools = !!(l && l.tools); UI.iaToolsMax = (l && l.tools && l.tools.maxCount) || 0; UI.iaImages = !!(l && l.images); }).catch(() => { UI.iaTools = false; }); if (S && (UI.tab === 'time' || UI.tab === 'comprar')) render(); if ($('#chat-box')) desenharChat(); }).catch(() => { UI.ia = false; });
    claude.use('downloads').then((d) => { UI.downloads = d; }).catch(() => { UI.downloads = null; });
  } else UI.ia = false;
  Store.init();
})();


/* ---------------- versão independente: indicadores por API pública ---------------- */
async function atualizarMercadoStandalone() {
  let cache = null; try { cache = JSON.parse(localStorage.getItem('m100k-mercado') || 'null'); } catch (e) { cache = null; }
  if (cache) { MERCADO_VIVO = cache; invalidar(); }
  if (cache && cache.atualizadoEm && Date.now() - new Date(cache.atualizadoEm).getTime() < 6 * 3600 * 1000) return;
  const v = Object.assign({ titulo: 'O mercado agora' }, cache || {}); let ok = false;
  const sgs = async (n) => { const r = await fetch('https://api.bcb.gov.br/dados/serie/bcdata.sgs.' + n + '/dados/ultimos/1?formato=json'); const j = await r.json(); return { v: parseFloat(String(j[0].valor).replace(',', '.')), data: j[0].data }; };
  try { v.selic = (await sgs(432)).v; ok = true; } catch (e) { /* sem acesso */ }
  try { v.cdi = (await sgs(4389)).v; ok = true; } catch (e) { /* sem acesso */ }
  try { const s = await sgs(13522); v.ipca12m = s.v; v.ipcaRef = 'até ' + s.data.slice(3); ok = true; } catch (e) { /* sem acesso */ }
  try {
    const r = await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL,BTC-BRL'); const j = await r.json();
    if (j.USDBRL) { v.dolar = parseFloat(j.USDBRL.bid); v.dolarVarDia = parseFloat(j.USDBRL.pctChange); }
    if (j.BTCBRL) { v.bitcoinBRL = parseFloat(j.BTCBRL.bid); v.btcVarDia = parseFloat(j.BTCBRL.pctChange); }
    ok = true;
  } catch (e) { /* sem acesso */ }
  if (!ok) return;
  v.atualizadoEm = new Date().toISOString(); v.resumo = null; v.paraVoce = null; v.manchetes = [];
  MERCADO_VIVO = v; try { localStorage.setItem('m100k-mercado', JSON.stringify(v)); } catch (e) { /* ok */ }
  invalidar();
  const digitando = document.activeElement && document.activeElement.matches && document.activeElement.matches('input,textarea,select');
  if (S && !digitando && !$('#sheet-bg') && (UI.tab === 'hoje' || UI.tab === 'futuro')) render();
}
